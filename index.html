<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper — my command desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1419;--p:#171e26;--p2:#1f2833;--ln:#2b3644;--tx:#e8edf2;--mu:#8b99a8;--ac:#f2c14e;--ok:#4cc38a;--bad:#ef6a5b;--bl:#5aa9e6;--r:14px}
@media(prefers-color-scheme:light){:root{--bg:#f3f1ec;--p:#fff;--p2:#f6f4ef;--ln:#dcd8cf;--tx:#1b232c;--mu:#58626e;--ac:#c98a00;--ok:#1f9d6a;--bad:#d6483a;--bl:#2f7fc1}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.big{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.pri{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:600}
input,textarea,select{font:inherit;width:100%;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
label{color:var(--mu);font-size:13px}
#app{display:flex;min-height:100vh}
nav{width:200px;padding:20px 12px;border-right:1px solid var(--ln);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:24px;padding:0 10px 14px}
nav button{text-align:left;border:0;background:none;padding:10px 12px;color:var(--mu)}
nav button.on{background:var(--p);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
nav .sp{flex:1}
main{flex:1;padding:24px;max-width:1100px;margin:auto;width:100%}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.hd h2{font-size:28px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.stat .big{font-size:38px;font-weight:800;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
.q{min-height:180px}.q h3{font-size:16px;margin-bottom:2px}.q small{color:var(--mu);display:block;margin-bottom:10px}
.q1{border-top:3px solid var(--bad)}.q2{border-top:3px solid var(--bl)}.q3{border-top:3px solid var(--ac)}.q4{border-top:3px solid var(--mu)}
.t{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.t:hover{border-color:var(--ac)}.t b{font-weight:600}.t small{color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.late{color:var(--bad)!important}.bar{height:8px;background:var(--p2);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 6px 20px #0006}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#m.on{display:flex}#m>div{background:var(--p);border:1px solid var(--ln);border-radius:var(--r);padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.pick{display:flex;gap:6px;margin:6px 0 12px}.pick button{flex:1;padding:10px 0}.pick button.on{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:700}
.row{display:flex;gap:8px;align-items:center}.row>*{margin:0}.sp2{justify-content:space-between}
.mu{color:var(--mu)}.chart{display:flex;gap:8px;align-items:flex-end;height:120px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.chart i{display:block;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:4px}
#lock{max-width:380px;margin:12vh auto;padding:20px}#lock h1{font-size:44px;margin-bottom:4px}
.err{color:var(--bad);min-height:20px;font-size:13px}

[hidden]{display:none!important}
body{background:radial-gradient(900px 500px at 85% -10%,#f2c14e22,transparent 60%),radial-gradient(700px 500px at -10% 110%,#5aa9e61f,transparent 60%),var(--bg);background-attachment:fixed}
main{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{box-shadow:0 1px 0 #ffffff08 inset,0 8px 24px -14px #000a}
.t{transition:transform .15s,border-color .15s,box-shadow .15s}.t:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px #000}
.q{background:linear-gradient(180deg,var(--p2),var(--p) 90px)}
.stat .big{background:linear-gradient(120deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .big.late{background:none;color:var(--bad)}
nav{background:linear-gradient(180deg,var(--p),transparent)}
nav h1{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),#e8833a);color:#1a1405;display:grid;place-items:center;font:800 20px 'Bricolage Grotesque',sans-serif}
nav button{border-radius:10px;transition:background .15s}nav button:hover{background:var(--p2);color:var(--tx)}
.fab{background:linear-gradient(135deg,var(--ac),#e8833a);border:0;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 20px #f2c14e44}50%{box-shadow:0 6px 30px #f2c14e99}}
.pick button.on{box-shadow:0 4px 14px -4px var(--ac)}
#lock{max-width:400px;margin:12vh auto;padding:34px 30px;background:var(--p);border:1px solid var(--ln);border-radius:22px;box-shadow:0 30px 60px -30px #000;text-align:center;animation:in .5s ease}
#lock .logo{margin:0 auto 14px;width:56px;height:56px;font-size:30px;border-radius:16px}
#lock h1{font-size:40px}
.gbtn{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;padding:13px;font-weight:600;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:12px;box-shadow:0 2px 8px -3px #0006}
.gbtn:hover{background:#f6f8fb;border-color:#c6c9ce}
.gbtn b{font:700 18px Arial;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.mode{font-size:11px;padding:6px 12px;color:var(--mu)}.mode.warn{color:var(--bad)}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow:auto;border:0;border-bottom:1px solid var(--ln);padding:8px}nav h1,nav .sp{display:none}nav button{white-space:nowrap}.g2{grid-template-columns:1fr}main{padding:14px}}

.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:30;background:var(--ac);color:#1a1405;padding:10px 14px;border-radius:8px}
button,input:not([type=checkbox]),select{min-height:44px}input[type=checkbox]{width:22px!important;height:22px;margin:0}
button.t,.card.t{display:block;width:100%;text-align:left;color:var(--tx)}main:focus{outline:none}
.chat{height:190px;overflow:auto;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px;margin:8px 0}.msg{margin:5px 0}.msg b{color:var(--ac)}.msg.me{text-align:right}
.mob{display:none}nav .out{font-size:13px;text-align:left}
@media(max-width:760px){nav{position:fixed;inset:auto 0 0 0;top:auto;width:100%;height:auto;flex-direction:row;gap:2px;overflow-x:auto;z-index:5;background:var(--p);border:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav h1,nav .sp,nav .out,nav .mode,nav #sync{display:none}nav button{flex:0 0 auto;min-width:76px;text-align:center;font-size:12px;padding:8px 6px}nav button.on{box-shadow:inset 0 3px var(--ac)}
main{padding:14px 14px 100px}.fab{bottom:88px;right:16px}.mob{display:inline-flex;gap:8px}.hd h2{font-size:24px}.g4{grid-template-columns:1fr 1fr}#m>div{padding:16px}}
@media(min-width:1500px){main{max-width:1280px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="lock"></div>
<div id="app" hidden></div>
<div id="m"><div id="mb" role="dialog" aria-modal="true" aria-label="Dialog"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* SETUP: paste your Firebase web config here. Leave apiKey empty = local-only mode (no login, data stays in this browser). */
const CFG={apiKey:"AIzaSyDIcP9eE4Tmqg7Ma-EVTdfgxawIwwLIAds",authDomain:"keeper-50e65.firebaseapp.com",projectId:"keeper-50e65",appId:"1:717094957696:web:a2b56c990ba0c4b737ac65"};

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const TODAY=()=>iso(new Date()),addD=(n,from)=>{const d=new Date(from||Date.now());d.setDate(d.getDate()+n);return iso(d)};
const diff=a=>Math.round((new Date(a+'T00:00')-new Date(TODAY()+'T00:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLOUD=!!CFG.apiKey;let fb,user,DB,tab='dash',saveT;

/* ---------- storage (plain JSON; Firestore if configured, else this browser) ---------- */
const blank=()=>({tasks:[],ideas:[],learn:[],goals:[],score:0,log:[]});
async function readRaw(){return CLOUD?(await fb.firestore().doc('vaults/'+user.uid).get()).data():JSON.parse(localStorage.getItem('keeper_data')||'null')}
async function writeRaw(v){CLOUD?await fb.firestore().doc('vaults/'+user.uid).set(v):localStorage.setItem('keeper_data',JSON.stringify(v))}
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{try{await writeRaw({json:JSON.stringify(DB),t:Date.now()});$('#sync')&&($('#sync').textContent='Saved ✓')}catch(e){$('#sync')&&($('#sync').textContent='Save failed')}},400);$('#sync')&&($('#sync').textContent='Saving…')}

/* ---------- login (only when Firebase is configured) ---------- */
function lock(msg){
 $('#lock').hidden=false;$('#app').hidden=true;
 $('#lock').innerHTML=`<div class="logo">K</div><h1>Keeper</h1><p class="mu" style="margin:6px 0 26px">Your ideas and jobs, held to account.<br>Sign in to open your own space.</p>
 <button class="gbtn" onclick="google()"><b>G</b> Continue with Google</button><div class="err" style="margin-top:12px">${msg||''}</div>`;
}
async function google(){
 const b=document.querySelector('.gbtn');b&&(b.disabled=true);
 const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
 try{await fb.auth().signInWithPopup(pr)}
 catch(e){
  if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return lock();
  lock(e.code==='auth/popup-blocked'?'Your browser blocked the sign-in popup. Allow pop-ups for this site and try again.':esc((e.code||'error')+' — '+(e.message||'')))}
}
async function load(){
 try{const raw=await readRaw();DB=raw?JSON.parse(raw.json):blank();if(!raw)await writeRaw({json:JSON.stringify(DB),t:Date.now()});
  DB.trips=DB.trips||[];$('#lock').hidden=true;$('#app').hidden=false;render();if(CLOUD)ensureProfile().catch(e=>{SHERR=e.message;render()})}
 catch(e){lock(esc(e.message||'Could not load data'))}
}
const logout=()=>fb.auth().signOut();

/* ---------- priority logic ---------- */
const quad=t=>t.imp>=3&&t.urg>=3?1:t.imp>=3?2:t.urg>=3?3:4;
const QN={1:['Do now','Important + urgent'],2:['Schedule','Important, not urgent'],3:['Squeeze / delegate','Urgent, not important'],4:['Drop or park','Neither']};
function autoDeadline(w){
 const open=DB.tasks.filter(t=>!t.done&&t.ctx===w.ctx).length;
 const base={5:1,4:3,3:7,2:14,1:30}[w.urg];
 return addD(base+Math.ceil(w.eff/4)+Math.floor(open/3)+(w.imp<=2?2:0));
}
const openT=ctx=>DB.tasks.filter(t=>!t.done&&(!ctx||t.ctx===ctx));

/* ---------- views ---------- */
const TABS=[['dash','◉  Dashboard'],['work','▣  Work'],['personal','◐  Personal'],['shared','⇄  Shared'],['trips','✈  Trips'],['msgs','✉  Messages'],['ideas','✦  Ideas'],['learn','✎  Learning'],['goals','◎  Targets']];
function render(fid){
 $('#app').innerHTML=`<nav aria-label="Main"><h1><span class="logo" aria-hidden="true">K</span>Keeper</h1>${TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" ${tab===k?'aria-current="page"':''} onclick="go('${k}')">${n}</button>`).join('')}<div class="sp"></div>${CLOUD&&user?`<button class="out" onclick="profForm()" aria-label="Edit profile">👤 ${esc(PROF?.name||user.displayName||'Profile')}</button>`:''}<small class="mode ${CLOUD?'':'warn'}">${CLOUD?'☁ Cloud sync on · v6':'⚠ Local only · v6'}</small><small id="sync" class="mu" role="status" aria-live="polite" style="padding:6px 12px">Ready</small>${CLOUD?'<button class="out" onclick="logout()">Sign out</button>':''}</nav><main id="main" tabindex="-1">${VIEWS[tab]()}</main><button class="fab pri" onclick="wiz()" aria-label="Add job">+</button>`;
 if(fid){const e=$('#'+fid);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}}
}
const go=k=>{tab=k;curTrip=null;if(k==='msgs'&&CLOUD)loadPeople();render();$('#main').focus()};
function tcard(t){const d=diff(t.deadline),done=t.steps.filter(s=>s.done).length;
 return`<button class="t" onclick="detail('${t.id}')"><b>${esc(t.title)}</b><small><span class="${d<0?'late':''}">${d<0?Math.abs(d)+' days overdue':d===0?'due today':'due in '+d+' days'}</span>${t.steps.length?`<span>${done}/${t.steps.length} steps</span>`:''}${t.ext?`<span class="late">extended ×${t.ext}</span>`:''}</small></button>`}
function matrix(ctx){
 const ts=openT(ctx).sort((a,b)=>a.deadline.localeCompare(b.deadline));
 return`<div class="hd"><h2>${ctx==='work'?'At work':'Personal'}</h2><span class="mu">${ts.length} open</span></div><div class="grid g2">${[1,2,3,4].map(n=>`<div class="card q q${n}"><h3>${QN[n][0]}</h3><small>${QN[n][1]}</small>${ts.filter(t=>quad(t)===n).map(tcard).join('')||'<span class="mu">Nothing here.</span>'}</div>`).join('')}</div>`}
function dash(){
 const done=DB.tasks.filter(t=>t.done),y=new Date().getFullYear(),m=TODAY().slice(0,7);
 const onT=done.filter(t=>t.doneAt<=t.deadline).length,rate=done.length?Math.round(onT/done.length*100):0;
 const od=openT().filter(t=>diff(t.deadline)<0).length;
 const focus=openT().sort((a,b)=>quad(a)-quad(b)||a.deadline.localeCompare(b.deadline)).slice(0,3);
 const cnt=yr=>Array.from({length:12},(_,i)=>done.filter(t=>t.doneAt.startsWith(yr+'-'+String(i+1).padStart(2,'0'))).length);
 const mo=cnt(y),pm=cnt(y-1),mx=Math.max(1,...mo,...pm),cm=new Date().getMonth();
 const ytd=a=>a.slice(0,cm+1).reduce((s,v)=>s+v,0),A=ytd(mo),B=ytd(pm);
 const otr=yr=>{const d=done.filter(t=>t.doneAt.startsWith(yr));return d.length?Math.round(d.filter(t=>t.doneAt<=t.deadline).length/d.length*100):null};
 const R1=otr(String(y)),R0=otr(String(y-1));
 const dl=(a,b,u='')=>b===0&&a===0?'no change':b===0?'+'+a+u+' (no data last year)':(a>=b?'+':'')+(a-b)+u+(u?'':' ('+(a>=b?'+':'')+Math.round((a-b)/b*100)+'%)');
 const col=(a,b)=>a>=b?'var(--ok)':'var(--bad)';
 const mom=mo[cm]-(cm?mo[cm-1]:pm[11]);
 const gl=DB.goals.filter(g=>g.period==='month'||g.period==='year').map(g=>`<div style="margin-bottom:10px"><div class="row sp2"><span>${esc(g.title)} <span class="mu">(${g.period})</span></span><span class="mu">${g.progress}/${g.target}</span></div><div class="bar"><i style="width:${Math.min(100,g.progress/g.target*100)}%"></i></div></div>`).join('')||'<span class="mu">Set a monthly or yearly target in Targets.</span>';
 return`<div class="hd"><h2>Today</h2><span class="mob">${CLOUD?'<button onclick="profForm()">Profile</button> <button onclick="logout()">Sign out</button>':''}</span></div>
 <div class="grid g4"><div class="card stat"><div class="big">${DB.score}</div><span>discipline score</span></div><div class="card stat"><div class="big">${rate}%</div><span>done on time</span></div><div class="card stat"><div class="big ${od?'late':''}">${od}</div><span>overdue</span></div><div class="card stat"><div class="big">${done.filter(t=>t.doneAt.startsWith(m)).length}</div><span>finished this month</span></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin-bottom:10px">Do these first</h3>${focus.map(tcard).join('')||'<span class="mu">Nothing open. Tap + when something comes in.</span>'}</div>
 <div class="card"><h3 style="margin-bottom:10px">Targets</h3>${gl}</div></div>
 <div class="card" style="margin-top:14px"><div class="row sp2" style="flex-wrap:wrap;margin-bottom:12px"><h3>Am I improving?</h3><span class="mu" style="font-size:13px"><span style="display:inline-block;width:10px;height:10px;background:var(--mu);opacity:.5;border-radius:2px"></span> ${y-1} &nbsp;<span style="display:inline-block;width:10px;height:10px;background:var(--ac);border-radius:2px"></span> ${y}</span></div>
 <div class="grid g4" style="margin-bottom:16px">
 <div><span class="mu">Year to date vs ${y-1}</span><div class="big" style="font-size:22px;color:${col(A,B)}">${dl(A,B)}</div><span class="mu">${A} vs ${B} jobs</span></div>
 <div><span class="mu">On-time rate vs ${y-1}</span><div class="big" style="font-size:22px;color:${R1===null||R0===null?'var(--mu)':col(R1,R0)}">${R1===null||R0===null?'not enough data':dl(R1,R0,' pts')}</div><span class="mu">${R1??'–'}% vs ${R0??'–'}%</span></div>
 <div><span class="mu">This month vs last month</span><div class="big" style="font-size:22px;color:${mom>=0?'var(--ok)':'var(--bad)'}">${mom>=0?'+':''}${mom}</div><span class="mu">${mo[cm]} finished so far</span></div></div>
 <div class="chart">${mo.map((v,i)=>`<div><div style="display:flex;gap:2px;align-items:flex-end;height:96px"><i style="flex:1;height:${pm[i]/mx*90}px;background:var(--mu);opacity:.5"></i><i style="flex:1;height:${v/mx*90}px"></i></div>${'JFMAMJJASOND'[i]}<br>${pm[i]}→${v}</div>`).join('')}</div></div>`}
function ideas(){return`<div class="hd"><h2>Ideas</h2></div><div class="card"><div class="row"><input id="ni" aria-label="Drop an idea before it escapes…" placeholder="Drop an idea before it escapes…" onkeydown="if(event.key==='Enter')addIdea()"><button class="pri" onclick="addIdea()">Save</button></div></div><div style="margin-top:14px">${DB.ideas.map(i=>`<div class="card row sp2" style="margin-bottom:8px"><span>${esc(i.t)}</span><span class="row"><button onclick="wiz('${i.id}')">Make it a job</button><button onclick="DB.ideas=DB.ideas.filter(x=>x.id!=='${i.id}');save();render()" aria-label="Delete">✕</button></span></div>`).join('')||'<p class="mu">No ideas parked yet.</p>'}</div>`}
function learn(){return`<div class="hd"><h2>Learning</h2></div><div class="card"><div class="row"><input id="nl" aria-label="Something to learn…" placeholder="Something to learn…" onkeydown="if(event.key==='Enter')addLearn()"><button class="pri" onclick="addLearn()">Add</button></div></div><div style="margin-top:14px">${DB.learn.map(l=>`<div class="card row sp2" style="margin-bottom:8px"><label class="row" style="color:var(--tx);font-size:15px"><input type="checkbox" style="width:auto" ${l.done?'checked':''} onchange="tl('${l.id}')"><span style="${l.done?'text-decoration:line-through;opacity:.6':''}">${esc(l.t)}</span></label><span class="mu">${l.from?'for: '+esc(l.from):''}</span></div>`).join('')||'<p class="mu">Learning needs from your job plans will show up here.</p>'}</div>`}
function goals(){return`<div class="hd"><h2>Targets</h2></div><div class="card"><div class="row"><input id="gt" aria-label="Target, e.g. Finish 8 paper sections" placeholder="Target, e.g. Finish 8 paper sections"><input id="gn" aria-label="Target number" type="number" min="1" value="5" style="max-width:80px"><select id="gp" aria-label="Period" style="max-width:110px"><option value="month">Month</option><option value="year">Year</option></select><button class="pri" onclick="addGoal()">Add</button></div></div><div style="margin-top:14px">${DB.goals.map(g=>`<div class="card" style="margin-bottom:8px"><div class="row sp2"><b>${esc(g.title)} <span class="mu">(${g.period})</span></b><span class="row"><button onclick="gp('${g.id}',-1)">−</button><b>${g.progress}/${g.target}</b><button onclick="gp('${g.id}',1)">+</button><button onclick="DB.goals=DB.goals.filter(x=>x.id!=='${g.id}');save();render()" aria-label="Delete">✕</button></span></div><div class="bar"><i style="width:${Math.min(100,g.progress/g.target*100)}%"></i></div></div>`).join('')||'<p class="mu">No targets yet.</p>'}</div>`}

/* ---------- actions ---------- */
const addIdea=()=>{const v=$('#ni').value.trim();if(!v)return;DB.ideas.unshift({id:uid(),t:v});save();render()};
const addLearn=()=>{const v=$('#nl').value.trim();if(!v)return;DB.learn.unshift({id:uid(),t:v,done:false});save();render()};
const tl=id=>{const l=DB.learn.find(x=>x.id===id);l.done=!l.done;save();render()};
const addGoal=()=>{const t=$('#gt').value.trim();if(!t)return;DB.goals.push({id:uid(),title:t,target:+$('#gn').value||1,period:$('#gp').value,progress:0});save();render()};
const gp=(id,n)=>{const g=DB.goals.find(x=>x.id===id);g.progress=Math.max(0,g.progress+n);save();render()};
const modal=(h,lock)=>{LOCK=!!lock;const o=$('#m').classList.contains('on');if(!o)lastF=document.activeElement;$('#mb').innerHTML=h;$('#m').classList.add('on');const f=$('#mb').querySelector('input:not([type=checkbox]),textarea,button');f&&f.focus()},
closeM=()=>{if(chatUn){chatUn();chatUn=null}$('#m').classList.remove('on');lastF&&lastF.focus&&lastF.focus()};
$('#m').addEventListener('click',e=>{if(e.target.id==='m'&&!LOCK)closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#m').classList.contains('on')&&!LOCK)closeM()});
const pk=(k,n)=>`<div class="pick">${[1,2,3,4,5].map(v=>`<button aria-pressed="${W[k]===v}" class="${W[k]===v?'on':''}" onclick="W.${k}=${v};wizR()">${v}</button>`).join('')}</div>`;

/* ---------- add-job wizard (3 short stages) ---------- */
let W;
function wiz(ideaId){const i=DB.ideas.find(x=>x.id===ideaId);W={s:1,title:i?i.t:'',ctx:tab==='personal'?'personal':'work',imp:3,urg:3,eff:2,learn:'',idea:ideaId};wizR()}
function wizR(){
 const f=document.activeElement;if(W.s===1&&$('#wt'))W.title=$('#wt').value,W.learn=$('#wl').value;
 if(W.s===1)return modal(`<h3>What is it? <span class="mu">1/3</span></h3><label for="wt">Job</label><input id="wt" value="${esc(W.title)}" autofocus><label>Where does it belong?</label><div class="pick"><button aria-pressed="${W.ctx==='work'}" class="${W.ctx==='work'?'on':''}" onclick="W.ctx='work';wizR()">Work</button><button aria-pressed="${W.ctx==='personal'}" class="${W.ctx==='personal'?'on':''}" onclick="W.ctx='personal';wizR()">Personal</button></div><label for="wl">Need to learn something for it? (optional)</label><input id="wl" value="${esc(W.learn)}"><div class="row sp2"><button onclick="closeM()">Cancel</button><button class="pri" onclick="W.title=$('#wt').value.trim();W.learn=$('#wl').value.trim();if(W.title){W.s=2;wizR()}">Next</button></div>`);
 if(W.s===2)return modal(`<h3>How much does it matter? <span class="mu">2/3</span></h3><label>Importance — does it move my real goals? (1 low – 5 critical)</label>${pk('imp')}<label>Urgency — what happens if it waits a week? (1 nothing – 5 someone is blocked)</label>${pk('urg')}<label for="we">Effort in hours (total)</label><input id="we" type="number" min="1" value="${W.eff}" onchange="W.eff=+this.value||1"><div class="row sp2"><button onclick="W.s=1;wizR()">Back</button><button class="pri" onclick="W.eff=+$('#we').value||1;W.s=3;wizR()">Next</button></div>`);
 W.dl=autoDeadline(W);const q=quad(W);
 modal(`<h3>Your deadline <span class="mu">3/3</span></h3><p><b>${esc(W.title)}</b></p><p class="mu" style="margin:8px 0">Lands in <b style="color:var(--ac)">${QN[q][0]}</b> (${W.ctx}).</p><div class="card stat" style="margin:12px 0"><div class="big">${W.dl}</div><span>${diff(W.dl)} days from today. Extending it later costs points.</span></div><div class="row sp2"><button onclick="W.s=2;wizR()">Back</button><button class="pri" onclick="commit()">I commit</button></div>`)}
function commit(){
 const t={id:uid(),title:W.title,ctx:W.ctx,imp:W.imp,urg:W.urg,eff:W.eff,deadline:W.dl,created:TODAY(),done:false,ext:0,steps:[]};
 DB.tasks.push(t);if(W.learn)DB.learn.unshift({id:uid(),t:W.learn,from:W.title,done:false});
 if(W.idea)DB.ideas=DB.ideas.filter(x=>x.id!==W.idea);
 save();closeM();tab=W.ctx;render();detail(t.id)}

/* ---------- task detail: plan steps, finish, extend ---------- */
function detail(id){const t=DB.tasks.find(x=>x.id===id),d=diff(t.deadline);
 modal(`<h3>${esc(t.title)}</h3><p class="${d<0?'late':'mu'}">Due ${t.deadline} · ${d<0?Math.abs(d)+' days overdue':d+' days left'} · ${QN[quad(t)][0]}</p>
 <h4 style="margin:14px 0 6px">Plan: internal targets</h4>
 ${t.steps.map((s,i)=>`<div class="row sp2" style="margin-bottom:6px"><label class="row" style="color:var(--tx)"><input type="checkbox" style="width:auto" ${s.done?'checked':''} onchange="stp('${id}',${i})"><span style="${s.done?'text-decoration:line-through;opacity:.6':''}">${esc(s.t)}</span></label><span class="mu ${!s.done&&diff(s.d)<0?'late':''}">${s.d}</span></div>`).join('')||'<p class="mu">Break it down so the deadline is believable.</p>'}
 <div class="row" style="margin-top:8px"><input id="st" aria-label="Step" placeholder="Step"><input id="sd" aria-label="Step date" type="date" max="${t.deadline}" value="${t.deadline}" style="max-width:150px"><button onclick="addStep('${id}')">Add</button></div>
 <div class="row sp2" style="margin-top:16px"><span class="row"><button onclick="ext('${id}')">Need more time</button><button onclick="if(confirm('Delete this job?')){DB.tasks=DB.tasks.filter(x=>x.id!=='${id}');save();closeM();render()}">Delete</button></span><span class="row"><button onclick="closeM();render()">Close</button><button class="pri" onclick="fin('${id}')">Done</button></span></div>`)}
const stp=(id,i)=>{const s=DB.tasks.find(x=>x.id===id).steps[i];s.done=!s.done;save();detail(id)};
function addStep(id){const t=$('#st').value.trim();if(!t)return;DB.tasks.find(x=>x.id===id).steps.push({t,d:$('#sd').value,done:false});save();detail(id)}
function fin(id){const t=DB.tasks.find(x=>x.id===id),late=t.deadline<TODAY();
 t.done=true;t.doneAt=TODAY();const pts=late?2:10+t.imp*2;DB.score+=pts;
 DB.goals.forEach(g=>{});save();closeM();render()}
function ext(id){const t=DB.tasks.find(x=>x.id===id),pen=5*(t.ext+1);
 const n=prompt(`New deadline (YYYY-MM-DD). This costs ${pen} points.`,addD(3,t.deadline));
 if(!n||!/^\d{4}-\d\d-\d\d$/.test(n)||n<=t.deadline)return alert('Pick a date later than the current deadline.');
 t.deadline=n;t.ext++;DB.score-=pen;save();detail(id);render()}

/* ===== v6: profile, shared tasks + chat, trips ===== */
const FS=()=>fb.firestore();let SH=[],SHERR='',unsubSH,curTrip=null,chatUn=null,PROF=null,LOCK=false,lastF;
const VIEWS={dash,work:()=>matrix('work'),personal:()=>matrix('personal'),shared:sharedV,trips:tripsV,msgs:msgsV,ideas,learn,goals};
async function ensureProfile(){const d=await FS().doc('profiles/'+user.uid).get();PROF=d.exists?d.data():null;
 if(unsubSH)unsubSH();listenMore();
 unsubSH=FS().collection('shared').where('members','array-contains',user.uid).onSnapshot(s=>{SHERR='';SH=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='shared'&&!$('#m').classList.contains('on'))render()},e=>{SHERR=e.message;if(tab==='shared')render()});
 PROF?render():profForm(true)}
function profForm(first){const p=PROF||{name:user.displayName||'',role:'',org:'',about:''};
 modal(`<h3>${first?'Welcome! Tell us about you':'Your profile'}</h3><p class="mu">Teammates see this when you share tasks.</p>
 <label for="pn">Full name</label><input id="pn" value="${esc(p.name)}" autocomplete="name">
 <label for="pr">Role / designation</label><input id="pr" value="${esc(p.role)}" placeholder="e.g. Research engineer">
 <label for="po">Organisation</label><input id="po" value="${esc(p.org)}">
 <label for="pa">What do you work on? (optional)</label><textarea id="pa" rows="2">${esc(p.about)}</textarea>
 <div class="row sp2">${first?'<span></span>':'<button onclick="closeM()">Cancel</button>'}<button class="pri" onclick="saveProf()">Save profile</button></div>`,first)}
async function saveProf(){const n=$('#pn').value.trim(),r=$('#pr').value.trim();if(!n||!r)return alert('Name and role are required.');
 PROF={uid:user.uid,name:n,role:r,org:$('#po').value.trim(),about:$('#pa').value.trim(),email:(user.email||'').toLowerCase(),photo:user.photoURL||''};
 await FS().doc('profiles/'+user.uid).set(PROF);closeM();render()}
/* shared */
function sharedV(){if(!CLOUD)return'<div class="hd"><h2>Shared</h2></div><p class="mu">Sign in with Google (cloud mode) to share tasks.</p>';
 return`<div class="hd"><h2>Shared tasks</h2><button class="pri" onclick="shNew()">+ New shared task</button></div>${SHERR?`<p class="err" role="alert">${esc(SHERR)} (publish the new Firestore rules)</p>`:''}<div class="grid g2">${SH.map(s=>`<button class="card t" onclick="shOpen('${s.id}')"><b>${esc(s.title)}</b><small><span>${s.done?'Done':'Open'}</span><span>due ${s.deadline||'—'}</span><span>${s.members.length} people</span></small></button>`).join('')||'<p class="mu">Nothing shared yet.</p>'}</div>`}
function shNew(){modal(`<h3>New shared task</h3><label for="st1">What needs doing?</label><input id="st1"><label for="sd1">Deadline</label><input id="sd1" type="date" value="${addD(7)}"><label for="si1">Invite by email (comma separated; they must have signed in once)</label><input id="si1" aria-label="a@x.com, b@y.com" placeholder="a@x.com, b@y.com"><div class="row sp2"><button onclick="closeM()">Cancel</button><button class="pri" onclick="shCreate()">Create</button></div>`)}
async function shCreate(){const t=$('#st1').value.trim();if(!t)return;
 const r=await FS().collection('shared').add({title:t,deadline:$('#sd1').value,owner:user.uid,members:[user.uid],names:{[user.uid]:PROF.name},done:false,created:Date.now()});
 const bad=[];for(const e of $('#si1').value.split(',').map(x=>x.trim()).filter(Boolean))if(!await shInvite(r.id,e))bad.push(e);
 closeM();if(bad.length)alert('Not found (ask them to sign in to Keeper first): '+bad.join(', '))}
async function shInvite(id,email){const q=await FS().collection('profiles').where('email','==',email.toLowerCase()).limit(1).get();if(q.empty)return false;const p=q.docs[0].data();
 await FS().doc('shared/'+id).update({members:firebase.firestore.FieldValue.arrayUnion(p.uid),['names.'+p.uid]:p.name});return true}
function shOpen(id){const s=SH.find(x=>x.id===id);if(!s)return;
 modal(`<h3>${esc(s.title)}</h3><p class="mu">Due ${s.deadline||'—'} · ${s.done?'Done':'Open'}</p><p><b>People:</b> ${s.members.map(u=>esc(s.names?.[u]||'Member')).join(', ')}</p>
 <div class="row" style="margin:8px 0"><input id="ie" type="email" aria-label="Invite by email" placeholder="Invite by email"><button onclick="shAdd('${id}')">Invite</button></div>
 <div id="chat" class="chat" role="log" aria-live="polite" aria-label="Messages"></div>
 <div class="row"><input id="cm" aria-label="Message" placeholder="Write a message…" onkeydown="if(event.key==='Enter')shSend('${id}')"><button class="pri" onclick="shSend('${id}')">Send</button></div>
 <div class="row sp2" style="margin-top:14px"><button onclick="shDone('${id}',${!s.done})">${s.done?'Reopen':'Mark done'}</button><span class="row">${s.owner===user.uid?`<button onclick="shDel('${id}')">Delete</button>`:''}<button onclick="closeM()">Close</button></span></div>`);
 chatUn=FS().collection('shared/'+id+'/msgs').orderBy('t').onSnapshot(q=>{const c=$('#chat');if(!c)return;c.innerHTML=q.docs.map(d=>{const m=d.data();return`<p class="msg ${m.uid===user.uid?'me':''}"><b>${esc(m.name)}</b> ${esc(m.text)}</p>`}).join('')||'<span class="mu">No messages yet.</span>';c.scrollTop=c.scrollHeight})}
async function shAdd(id){const e=$('#ie').value.trim();if(e)alert(await shInvite(id,e)?'Added. Reopen the task to see them.':'No Keeper user with that email. Ask them to sign in once.')}
const shSend=async id=>{const i=$('#cm'),t=i.value.trim();if(!t)return;i.value='';await FS().collection('shared/'+id+'/msgs').add({uid:user.uid,name:PROF.name,text:t,t:Date.now()})};
const shDone=(id,v)=>{FS().doc('shared/'+id).update({done:v});closeM()};
const shDel=async id=>{if(confirm('Delete for everyone?')){await FS().doc('shared/'+id).delete();closeM()}};
/* ===== v6: shared trips (members, assigned tasks, plan, chat) + direct messages ===== */
let TR=[],TRERR='',unsubTR,unsubDM,DMS=[],PEOPLE=null,DMC=null;
const live=()=>{const a=document.activeElement;if($('#m').classList.contains('on'))return;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.value&&a.type!=='checkbox')return;render(a&&a.id)};
function listenMore(){
 unsubTR&&unsubTR();unsubDM&&unsubDM();
 unsubTR=FS().collection('trips').where('members','array-contains',user.uid).onSnapshot(s=>{TRERR='';TR=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='trips')live()},e=>{TRERR=e.message;if(tab==='trips')render()});
 unsubDM=FS().collection('dms').where('members','array-contains',user.uid).onSnapshot(s=>{DMS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.last||0)-(a.last||0));if(tab==='msgs')live()},e=>{});
 loadPeople()}
const loadPeople=()=>FS().collection('profiles').limit(300).get().then(s=>{PEOPLE=s.docs.map(d=>d.data());if(tab==='msgs')live()}).catch(()=>{});
/* chat helpers */
function chatModal(title,path){modal(`<h3>${title}</h3><div id="chat" class="chat" role="log" aria-live="polite" aria-label="Messages"></div><div class="row"><input id="cm" aria-label="Message" placeholder="Write a message…" onkeydown="if(event.key==='Enter')send('${path}')"><button class="pri" onclick="send('${path}')">Send</button></div><div class="row sp2" style="margin-top:12px"><span></span><button onclick="closeM()">Close</button></div>`);
 chatUn=FS().collection(path).orderBy('t').onSnapshot(q=>{const c=$('#chat');if(!c)return;c.innerHTML=q.docs.map(d=>{const m=d.data();return`<p class="msg ${m.uid===user.uid?'me':''}"><b>${esc(m.name)}</b> ${esc(m.text)}</p>`}).join('')||'<span class="mu">No messages yet.</span>';c.scrollTop=c.scrollHeight})}
const send=async p=>{const i=$('#cm'),t=i.value.trim();if(!t)return;i.value='';await FS().collection(p).add({uid:user.uid,name:PROF.name,text:t,t:Date.now()});
 if(DMC&&p.startsWith('dms/'))FS().doc('dms/'+DMC.pid).set({members:DMC.pid.split('_'),names:DMC.names,last:Date.now(),lastText:t.slice(0,60)},{merge:true})};
function dmOpen(o,on){const pid=[user.uid,o].sort().join('_');DMC={pid,names:{[user.uid]:PROF.name,[o]:on}};chatModal('Message '+esc(on),'dms/'+pid+'/msgs')}
function msgsV(){if(!CLOUD)return'<div class="hd"><h2>Messages</h2></div><p class="mu">Sign in with Google to message people.</p>';
 const q=(window._pq||'').toLowerCase(),list=(PEOPLE||[]).filter(p=>p.uid!==user.uid&&(!q||(p.name+' '+p.role+' '+p.org+' '+p.email).toLowerCase().includes(q))).slice(0,30);
 const b=(u,n,s1,s2)=>`<button class="t" data-u="${u}" data-n="${esc(n)}" onclick="dmOpen(this.dataset.u,this.dataset.n)"><b>${esc(n)}</b><small><span>${esc(s1||'')}</span><span>${esc(s2||'')}</span></small></button>`;
 return`<div class="hd"><h2>Messages</h2></div><div class="grid g2"><section class="card"><h3 style="margin-bottom:10px">Conversations</h3>${DMS.map(d=>{const o=d.members.find(u=>u!==user.uid);return b(o,d.names?.[o]||'Member',d.lastText)}).join('')||'<p class="mu">No conversations yet. Find someone.</p>'}</section>
 <section class="card"><h3 style="margin-bottom:10px">Find people</h3><input id="pq" type="search" aria-label="Search people by name, role or email" placeholder="Search name, role, email" value="${esc(window._pq||'')}" oninput="window._pq=this.value;render('pq')">${list.map(p=>b(p.uid,p.name,p.role,p.org)).join('')||'<p class="mu">No matches.</p>'}</section></div>`}
/* trips */
const TL=['Passport / ID','Visa / permits','Tickets','Hotel bookings','Travel insurance','Cards and some cash','Chargers and power bank','Medicines','Set work auto-reply / handover','Tell bank about travel','Download offline maps'];
const who=(t,a)=>!a||!a.length?'Everyone':a.map(u=>esc(t.names?.[u]||'Member')).join(', ');
function tripsV(){if(!CLOUD)return'<div class="hd"><h2>Trips</h2></div><p class="mu">Sign in with Google to plan trips with others.</p>';
 const t=curTrip&&TR.find(x=>x.id===curTrip);if(t)return tripV(t);
 return`<div class="hd"><h2>Trips</h2></div>${TRERR?`<p class="err" role="alert">${esc(TRERR)} (publish the new Firestore rules)</p>`:''}<form class="card" onsubmit="tripNew(event)"><div class="grid g4"><div><label for="td">Destination</label><input id="td" required></div><div><label for="ts">Start</label><input id="ts" type="date" required value="${addD(30)}"></div><div><label for="te">End</label><input id="te" type="date" required value="${addD(34)}"></div><div><label for="tb">Budget</label><input id="tb" type="number" min="0" value="50000"></div></div><button class="pri">Plan trip</button></form><div class="grid g2" style="margin-top:14px">${TR.map(x=>`<button class="card t" onclick="curTrip='${x.id}';render()"><b>${esc(x.dest)}</b><small><span>${x.start} → ${x.end}</span><span>${diff(x.start)>=0?'in '+diff(x.start)+' days':'started'}</span><span>${x.members.length} people</span></small></button>`).join('')||'<p class="mu">No trips yet.</p>'}</div>`}
async function tripNew(e){e.preventDefault();const g=i=>$('#'+i).value;if(g('te')<g('ts'))return alert('End date must not be before the start.');
 const r=await FS().collection('trips').add({dest:g('td').trim(),start:g('ts'),end:g('te'),budget:+g('tb')||0,owner:user.uid,members:[user.uid],names:{[user.uid]:PROF.name},days:{},exp:[],book:[],tasks:TL.map(x=>({id:uid(),t:x,who:[],done:false})),created:Date.now()});curTrip=r.id;render()}
function tripV(t){const spent=(t.exp||[]).reduce((s,x)=>s+x.a,0),pct=t.budget?Math.min(100,spent/t.budget*100):0,n=Math.min(30,diff(t.end)-diff(t.start)+1),days=Array.from({length:Math.max(1,n)},(_,i)=>addD(i,t.start)),id=t.id;
 const mine=t.tasks.filter(x=>!x.done&&(!x.who.length||x.who.includes(user.uid)));
 const row=x=>`<div class="row sp2"><label class="row" style="color:var(--tx)"><input type="checkbox" ${x.done?'checked':''} onchange="tTog('${id}','${x.id}')"><span>${esc(x.t)} <small class="mu">· ${who(t,x.who)}</small></span></label><button aria-label="Remove ${esc(x.t)}" onclick="tmut('${id}',x=>{x.tasks=x.tasks.filter(y=>y.id!=='${x.id}')})">✕</button></div>`;
 const rm=(k,arr,i,txt)=>`<div class="row sp2"><span>${esc(txt)}</span><button aria-label="Remove ${esc(txt)}" onclick="tmut('${id}',x=>{x.${k}.splice(${i},1)})">✕</button></div>`;
 return`<div class="hd"><h2>${esc(t.dest)}</h2><span class="row"><button onclick="curTrip=null;render()">← All trips</button><button class="pri" onclick="chatModal('${esc(t.dest)} group chat','trips/${id}/msgs')">Group chat</button>${t.owner===user.uid?`<button onclick="tDel('${id}')">Delete</button>`:''}</span></div>
 <p class="mu">${t.start} → ${t.end} · ${diff(t.start)>=0?diff(t.start)+' days to go':'trip started'}</p>
 <section class="card" style="margin:14px 0"><h3>Travellers (${t.members.length})</h3><p>${t.members.map(u=>esc(t.names?.[u]||'Member')).join(', ')}</p><div class="row"><input id="ti" type="email" aria-label="Invite by email" placeholder="Invite by email (they must have signed in once)"><button onclick="tInv('${id}')">Invite</button></div></section>
 <section class="card"><h3 style="margin-bottom:8px">My tasks (${mine.length})</h3>${mine.map(row).join('')||'<span class="mu">Nothing assigned to you. 🎉</span>'}</section>
 <section class="card" style="margin-top:14px"><h3 style="margin-bottom:8px">All tasks &amp; responsibilities</h3>${t.tasks.map(row).join('')}
 <div style="margin-top:12px"><label for="tt">New task</label><input id="tt" placeholder="e.g. Book hotel" onkeydown="if(event.key==='Enter')tAddTask('${id}')"><fieldset style="border:0;padding:0;margin:0 0 10px"><legend class="mu" style="font-size:13px">Assign to (leave empty for everyone)</legend><div class="row" style="flex-wrap:wrap">${t.members.map(u=>`<label class="row" style="color:var(--tx);margin-right:10px"><input type="checkbox" name="as" value="${u}"> ${esc(t.names?.[u]||'Member')}</label>`).join('')}</div></fieldset><button class="pri" onclick="tAddTask('${id}')">Add task</button></div></section>
 <section class="card" style="margin-top:14px"><h3>Day-by-day plan</h3>${days.map(d=>`<div style="margin:12px 0"><b>${d}</b>${((t.days||{})[d]||[]).map((x,i)=>`<div class="row sp2"><span>${esc(x.t)} <small class="mu">· ${esc(x.by)}</small></span><button aria-label="Remove ${esc(x.t)}" onclick="tmut('${id}',x=>{x.days['${d}'].splice(${i},1)})">✕</button></div>`).join('')}<div class="row"><input id="d_${d}" aria-label="Activity for ${d}" placeholder="Add activity" onkeydown="if(event.key==='Enter')tAct('${id}','${d}')"><button onclick="tAct('${id}','${d}')">Add</button></div></div>`).join('')}</section>
 <div class="grid g2" style="margin-top:14px"><section class="card"><h3>Budget</h3><div class="row sp2"><span>${spent.toLocaleString()} of ${t.budget.toLocaleString()}</span><b class="${spent>t.budget?'late':''}">${(t.budget-spent).toLocaleString()} left</b></div><div class="bar" role="progressbar" aria-label="Budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%;background:${spent>t.budget?'var(--bad)':'var(--ok)'}"></i></div>${(t.exp||[]).map((x,i)=>rm('exp',0,i,x.t+' — '+x.a.toLocaleString()+' ('+x.by+')')).join('')}<div class="row"><input id="xe" aria-label="Expense name" placeholder="Expense"><input id="xa" type="number" aria-label="Amount" placeholder="Amount" style="max-width:110px"><button onclick="tExp('${id}')">Add</button></div></section>
 <section class="card"><h3>Bookings</h3>${(t.book||[]).map((x,i)=>rm('book',0,i,x.t+' ('+x.by+')')).join('')}<div class="row"><input id="bk" aria-label="Booking" placeholder="e.g. Flight AI-101, ref ABC123" onkeydown="if(event.key==='Enter')tBook('${id}')"><button onclick="tBook('${id}')">Add</button></div></section></div>`}
const tmut=(id,fn,fid)=>FS().runTransaction(async tx=>{const r=FS().doc('trips/'+id),d=await tx.get(r),x=d.data();fn(x);tx.set(r,x)}).then(()=>render(fid)).catch(e=>alert(e.message));
const tTog=(id,k)=>tmut(id,x=>{const a=x.tasks.find(y=>y.id===k);a.done=!a.done});
const tAddTask=id=>{const v=$('#tt').value.trim();if(!v)return;const w=[...document.querySelectorAll('input[name=as]:checked')].map(c=>c.value);tmut(id,x=>x.tasks.push({id:uid(),t:v,who:w,done:false}),'tt')};
const tAct=(id,d)=>{const v=$('#d_'+d).value.trim();if(!v)return;tmut(id,x=>{x.days=x.days||{};(x.days[d]=x.days[d]||[]).push({t:v,by:PROF.name})},'d_'+d)};
const tExp=id=>{const n=$('#xe').value.trim(),a=+$('#xa').value;if(!n||!a)return;tmut(id,x=>{(x.exp=x.exp||[]).push({t:n,a,by:PROF.name})},'xe')};
const tBook=id=>{const v=$('#bk').value.trim();if(!v)return;tmut(id,x=>{(x.book=x.book||[]).push({t:v,by:PROF.name})},'bk')};
async function tInv(id){const e=$('#ti').value.trim();if(!e)return;alert(await inviteTo('trips',id,e)?'Added to the trip.':'No Keeper user with that email yet. Ask them to sign in once.')}
async function inviteTo(col,id,email){const q=await FS().collection('profiles').where('email','==',email.toLowerCase()).limit(1).get();if(q.empty)return false;const p=q.docs[0].data();await FS().doc(col+'/'+id).update({members:firebase.firestore.FieldValue.arrayUnion(p.uid),['names.'+p.uid]:p.name});return true}
const tDel=async id=>{if(confirm('Delete this trip for everyone?')){curTrip=null;await FS().doc('trips/'+id).delete()}};

/* ---------- boot ---------- */
if(CLOUD&&typeof firebase==='undefined'){lock('Could not load Firebase. Check your internet or ad-blocker and refresh.')}
else if(CLOUD){firebase.initializeApp(CFG);fb=firebase;fb.auth().onAuthStateChanged(u=>{user=u;if(u)load();else{DB=null;PROF=null;SH=[];unsubSH&&unsubSH();unsubTR&&unsubTR();unsubDM&&unsubDM();TR=[];DMS=[];lock()}})}
else load();
</script>
</body>
</html>
